apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: production
  name: broadcaster-dep
spec:
  replicas: 6
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
        - name: broadcaster
          image: ako99/broadcaster:1bd25d2566539bf1cdcc2b3963c12a81634be38d
          imagePullPolicy: Always
          env:
            - name: NATS_URL
              value: "nats://my-nats:4222"
            - name: QUEUE_GROUP
              value: "todo-broadcaster-workers"
            - name: LOG_ONLY
              value: "false"
          envFrom:
            - secretRef:
                name: broadcaster-secret